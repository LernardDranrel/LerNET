build:
  maxIssues: 0

config:
  validation: true

complexity:
  LongMethod:
    threshold: 70
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
  CyclomaticComplexMethod:
    threshold: 16
  ComplexCondition:
    threshold: 5
  TooManyFunctions:
    thresholdInFiles: 24
    thresholdInClasses: 24
    thresholdInInterfaces: 24
    thresholdInObjects: 24
    thresholdInEnums: 24
    ignoreDeprecated: true
    ignorePrivate: true
    ignoreOverridden: true
  LargeClass:
    threshold: 700

empty-blocks:
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: "_|(ignore|expected).*"

exceptions:
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - InterruptedException
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
  TopLevelPropertyNaming:
    constantPattern: "[A-Z][_A-Z0-9]*"
  MatchingDeclarationName:
    active: true

style:
  MaxLineLength:
    maxLineLength: 140
    excludeCommentStatements: true
  MagicNumber:
    active: false
  WildcardImport:
    active: true
  ReturnCount:
    max: 4
  ThrowsCount:
    max: 3
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated:
      - Preview
  NewLineAtEndOfFile:
    active: true

comments:
  AbsentOrWrongFileLicense:
    active: false
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
