name: Publish LerNET v1.0.2

on:
  push:
    branches:
      - codex/release-upload-v1.0.2

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify release files
        working-directory: uploads/v1.0.2
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.2 \
            uploads/v1.0.2/LerNET-1.0.2.apk \
            uploads/v1.0.2/LerNET-1.0.2-install.exe \
            uploads/v1.0.2/LerNET-1.0.2-portable.zip \
            uploads/v1.0.2/SHA256SUMS.txt \
            --repo LernardDranrel/LerNET \
            --verify-tag \
            --title "LerNET 1.0.2" \
            --notes-file uploads/v1.0.2/RELEASE_NOTES.md
